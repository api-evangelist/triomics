aid: triomics
name: Triomics
description: Triomics is an AI healthcare company focused on oncology workflows, using
  AI agents to transform unstructured electronic health records into structured, actionable
  datasets for cancer centers and life sciences organizations. Its products include PRISM
  (AI-powered clinical trial matching), Symphony (visit preparation), Harmony (registry
  data curation and abstraction), and OncoLLM, a language model that reads entire patient
  charts to answer oncology-specific questions. The platform ingests HL7, FHIR, CCDA,
  PDF, and image formats, integrates with Epic, OncoEMR, iKnowMed, and Cerner, and is
  approved on the Epic App Marketplace. Triomics is deployed at cancer centers including
  Memorial Sloan Kettering and Mount Sinai, and raised $22 million backed by Battery
  Ventures, Lightspeed, Nexus, Y Combinator, and Oncology Ventures. Triomics does not
  currently publish a public developer portal, API documentation, or client SDKs.
